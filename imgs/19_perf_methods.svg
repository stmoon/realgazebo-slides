<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" font-family="'Noto Sans CJK KR',Arial,sans-serif">
<defs>
<marker id="m_slate" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker>
<marker id="m_slates" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#475569"/></marker>
<marker id="m_blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3b82f6"/></marker>
<marker id="m_blues" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#3b82f6"/></marker>
<marker id="m_green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#16a34a"/></marker>
<marker id="m_greens" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#16a34a"/></marker>
<marker id="m_red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#f87171"/></marker>
<marker id="m_reds" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#f87171"/></marker>
<marker id="m_amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#f59e0b"/></marker>
<marker id="m_ambers" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#f59e0b"/></marker>
<marker id="m_violet" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b5cf6"/></marker>
<marker id="m_violets" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#8b5cf6"/></marker>
<marker id="m_white" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#94a3b8"/></marker>
<marker id="m_whites" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#94a3b8"/></marker>
</defs>
<rect width="1600" height="560" fill="#ffffff"/>
<rect x="15" y="10" width="375" height="265" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<rect x="15" y="10" width="375" height="52" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
<text x="202" y="45" text-anchor="middle" font-size="24" fill="#6d28d9" font-weight="700">물리 스텝 줄이기</text>
<text x="202" y="96" text-anchor="middle" font-size="18" fill="#0f172a">물리 250Hz 에서 100Hz</text>
<text x="202" y="170" text-anchor="middle" font-size="17" fill="#475569">1초당 스텝 250회에서 100회로</text>
<text x="202" y="195" text-anchor="middle" font-size="17" fill="#475569">스텝 수 자체를 줄임</text>
<text x="202" y="250" text-anchor="middle" font-size="19" fill="#6d28d9" font-weight="700">30대 RTF 0.246 → 0.644</text>
<rect x="410" y="10" width="375" height="265" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<rect x="410" y="10" width="375" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="597" y="45" text-anchor="middle" font-size="24" fill="#1d4ed8" font-weight="700">고스트 경량화</text>
<text x="597" y="96" text-anchor="middle" font-size="18" fill="#0f172a">센서, 플러그인 제거</text>
<text x="597" y="123" text-anchor="middle" font-size="18" fill="#0f172a">강체 하나로 합침</text>
<text x="597" y="170" text-anchor="middle" font-size="17" fill="#475569">다른 서버 기체는 위치만 받으면</text>
<text x="597" y="195" text-anchor="middle" font-size="17" fill="#475569">되므로 매 스텝 계산을 뺌</text>
<text x="597" y="250" text-anchor="middle" font-size="19" fill="#1d4ed8" font-weight="700">20대 RTF +30%, 크래시 해소</text>
<rect x="805" y="10" width="375" height="265" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<rect x="805" y="10" width="375" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="992" y="45" text-anchor="middle" font-size="24" fill="#15803d" font-weight="700">월드와 로그 정리</text>
<text x="992" y="96" text-anchor="middle" font-size="18" fill="#0f172a">렌더링 센서 시스템 제거</text>
<text x="992" y="123" text-anchor="middle" font-size="18" fill="#0f172a">PX4 로그 끔</text>
<text x="992" y="170" text-anchor="middle" font-size="17" fill="#475569">쓰지 않는 렌더링 갱신과</text>
<text x="992" y="195" text-anchor="middle" font-size="17" fill="#475569">디스크 쓰기를 없앰</text>
<text x="992" y="250" text-anchor="middle" font-size="19" fill="#15803d" font-weight="700">30대 RTF 0.847 → 0.907</text>
<rect x="1200" y="10" width="375" height="265" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<rect x="1200" y="10" width="375" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="1387" y="45" text-anchor="middle" font-size="24" fill="#b45309" font-weight="700">메모리와 엔진</text>
<text x="1387" y="96" text-anchor="middle" font-size="18" fill="#0f172a">Gazebo 서버에 jemalloc</text>
<text x="1387" y="123" text-anchor="middle" font-size="18" fill="#0f172a">gz-sim 8.15</text>
<text x="1387" y="170" text-anchor="middle" font-size="17" fill="#475569">메모리 할당 비용을 줄이고</text>
<text x="1387" y="195" text-anchor="middle" font-size="17" fill="#475569">엔진 성능 수정을 반영</text>
<text x="1387" y="250" text-anchor="middle" font-size="19" fill="#b45309" font-weight="700">30대 RTF 0.646 → 0.953</text>
<rect x="15" y="290" width="375" height="265" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<rect x="15" y="290" width="375" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="202" y="325" text-anchor="middle" font-size="24" fill="#1d4ed8" font-weight="700">플러그인 최적화</text>
<text x="202" y="376" text-anchor="middle" font-size="18" fill="#0f172a">카메라 토픽 찾기 1초 1회</text>
<text x="202" y="403" text-anchor="middle" font-size="18" fill="#0f172a">ROS 실행기 재사용, 수신 스레드</text>
<text x="202" y="450" text-anchor="middle" font-size="17" fill="#475569">매 스텝 하던 일을 필요할 때만,</text>
<text x="202" y="475" text-anchor="middle" font-size="17" fill="#475569">스텝 루프 밖으로</text>
<text x="202" y="530" text-anchor="middle" font-size="19" fill="#1d4ed8" font-weight="700">PC당 16대 RTF 0.74 → 1.00</text>
<rect x="410" y="290" width="375" height="265" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<rect x="410" y="290" width="375" height="52" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
<text x="597" y="325" text-anchor="middle" font-size="24" fill="#6d28d9" font-weight="700">CPU 배치</text>
<text x="597" y="376" text-anchor="middle" font-size="18" fill="#0f172a">전원 성능 모드, CPU 가중치</text>
<text x="597" y="403" text-anchor="middle" font-size="18" fill="#0f172a">gz 성능 코어, PX4 효율 코어</text>
<text x="597" y="450" text-anchor="middle" font-size="17" fill="#475569">스텝 루프가 빠른 코어와</text>
<text x="597" y="475" text-anchor="middle" font-size="17" fill="#475569">높은 클럭을 먼저 쓰게</text>
<text x="597" y="530" text-anchor="middle" font-size="19" fill="#6d28d9" font-weight="700">땅 위 40대 RTF 0.68 → 1.00</text>
<rect x="805" y="290" width="375" height="265" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<rect x="805" y="290" width="375" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="992" y="325" text-anchor="middle" font-size="24" fill="#15803d" font-weight="700">통신과 탐색</text>
<text x="992" y="376" text-anchor="middle" font-size="18" fill="#0f172a">탐색 소켓 버퍼 8MB</text>
<text x="992" y="403" text-anchor="middle" font-size="18" fill="#0f172a">DDS 참가자 5개 → 4개, tc -batch</text>
<text x="992" y="450" text-anchor="middle" font-size="17" fill="#475569">대수가 늘 때 넘치던 탐색 패킷과</text>
<text x="992" y="475" text-anchor="middle" font-size="17" fill="#475569">프로세스 생성을 줄임</text>
<text x="992" y="530" text-anchor="middle" font-size="19" fill="#15803d" font-weight="700">100대 이륙 실패 0</text>
<rect x="1200" y="290" width="375" height="265" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<rect x="1200" y="290" width="375" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="1387" y="325" text-anchor="middle" font-size="24" fill="#b45309" font-weight="700">소환과 배치</text>
<text x="1387" y="376" text-anchor="middle" font-size="18" fill="#0f172a">상태 조회 공유, 소환 간격 0.2초</text>
<text x="1387" y="403" text-anchor="middle" font-size="18" fill="#0f172a">Gazebo 마다 고르게 배치</text>
<text x="1387" y="450" text-anchor="middle" font-size="17" fill="#475569">소환 대기와 한 Gazebo 로</text>
<text x="1387" y="475" text-anchor="middle" font-size="17" fill="#475569">쏠리는 부하를 없앰</text>
<text x="1387" y="530" text-anchor="middle" font-size="19" fill="#b45309" font-weight="700">30대 소환 160초 → 19초</text>
</svg>
